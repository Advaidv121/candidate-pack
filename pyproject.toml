[project]
name = "helpdesk-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph", "litellm", "langchain-litellm", "typesafe-sdk", "httpx", "pydantic>=2", "python-dotenv", "pyyaml", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
