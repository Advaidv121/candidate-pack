[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "litellm",
    "langchain",
    "langchain-litellm",
    "langfuse>=4.18,<5",
    "typesafe-sdk",
    "httpx",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer",
    "presidio-anonymizer",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

