action:
  type: noul
  instructions: Does decision.action fit the customer's request under the supplied support policy?
  criteria:
    'true': Reply is appropriate for an FAQ-covered request, handoff for a mandatory human case or unsupported request, and close for spam or empty content. Judge the action separately from the wording of the generated text.
    'false': The chosen action contradicts the support rules or the customer's substantive request.
language:
  type: noul
  instructions: Does decision.language match the customer's substantive message in ticket, and, for reply actions, is decision.draft_reply actually written in that same language?
  criteria:
    'true': The language label matches the customer's substantive message. For reply actions, every substantive explanatory sentence in decision.draft_reply is in that language. Quoted UI labels, product names, URLs, and short parenthetical translations may be in another language. For handoff and close actions, assess only the language label; the English handoff_note is internal and is not a customer-facing reply.
    'false': The language label differs from the customer's substantive message, or a reply contains substantive explanatory sentences in another language. A matching language label, greeting, or quoted UI labels do not compensate for instructions written in the wrong language.
category:
  type: noul
  instructions: Does decision.category fit the main issue in ticket under the policy's category definitions?
priority:
  type: noul
  instructions: Does decision.priority fit the impact reported in ticket under the policy's priority definitions?
grounding:
  type: noul
  instructions: Are the factual claims in decision supported by ticket or faq?
  criteria:
    'true': Factual claims and procedural instructions follow from the supplied evidence. Courtesy and requests for a human to investigate are allowed without claiming a resolution.
    'false': The output invents features, promises, causes, account changes, or procedural steps absent from the supplied evidence.
